name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Schema + backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ros_admin
          POSTGRES_PASSWORD: ros_admin_ci
          POSTGRES_DB: restaurant_ordering
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ros_admin -d restaurant_ordering"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ros_admin
      PGPASSWORD: ros_admin_ci
      PGDATABASE: restaurant_ordering
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ros_admin
      POSTGRES_PASSWORD: ros_admin_ci
      POSTGRES_DB: restaurant_ordering
      APP_DB_USER: ros_admin
      APP_DB_PASSWORD: ros_admin_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install 'psycopg[binary]' psycopg-pool faker
          pip install pytest pytest-asyncio httpx
          pip install fastapi 'python-jose[cryptography]' 'passlib[bcrypt]' \
                      pydantic-settings python-multipart uvicorn

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U ros_admin && break
            sleep 1
          done

      - name: Apply schema (db/0*.sql + db/1*.sql)
        run: |
          for f in db/0*.sql db/1*.sql; do
            echo "==> applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed data
        run: python scripts/seed_faker.py

      - name: Pytest (SQL + HTTP API)
        run: |
          cd backend
          pip install -e .
          python -m pytest tests/ -v

      - name: Smoke-test backend import
        run: |
          cd backend
          python -c "from app import main; assert main.app.routes"

  lint-python:
    name: Ruff (Python lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/ scripts/

  lint-sql:
    name: sqlfluff (SQL lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'sqlfluff>=3.0'
      - name: Lint db/*.sql
        run: sqlfluff lint --dialect postgres db/

  frontend:
    name: Frontend (tsc + next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Next build
        run: npm run build

  backup-drill:
    name: Backup + restore round-trip
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ros_admin
          POSTGRES_PASSWORD: ros_admin_ci
          POSTGRES_DB: restaurant_ordering
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ros_admin -d restaurant_ordering"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ros_admin
      PGPASSWORD: ros_admin_ci
      PGDATABASE: restaurant_ordering

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install 'psycopg[binary]' faker

      - name: Install postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16

      - name: Apply schema
        run: |
          for f in db/0*.sql db/1*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: ros_admin
          POSTGRES_PASSWORD: ros_admin_ci
          POSTGRES_DB: restaurant_ordering
        run: python scripts/seed_faker.py

      - name: Run disaster recovery drill
        run: |
          chmod +x db/backup/*.sh
          BACKUP_DIR=/tmp/ros_backups ./db/backup/disaster-recovery-drill.sh
